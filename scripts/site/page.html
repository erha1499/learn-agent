<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>learn-agent</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6bff'/%3E%3Ctext x='16' y='23' font-size='19' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='white'%3EA%3C/text%3E%3C/svg%3E">
<script>
document.documentElement.classList.add("js");
try { var t = localStorage.getItem("theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>{{css}}</style>
</head>
<body>
<header class="bar">
  <button class="icon menu" aria-label="目录">☰</button>
  <span class="bar-title"></span>
  <button class="icon theme" aria-label="深浅色">◐</button>
</header>
<div class="wrap">
  <nav>
    <div class="brand"><a href="#guide">learn-agent</a><button class="icon theme" aria-label="深浅色">◐</button></div>
    <input id="q" type="search" placeholder="搜索" aria-label="搜索" title="搜索（/）" autocomplete="off">
    <div class="results" hidden></div>
    <div class="toc">{{nav}}</div>
    <a class="repo" href="https://github.com/erha1499/learn-agent" target="_blank" rel="noopener">GitHub</a>
  </nav>
  <div class="scrim"></div>
  <main>{{main}}</main>
</div>
<script>{{js}}</script>
</body>
</html>
